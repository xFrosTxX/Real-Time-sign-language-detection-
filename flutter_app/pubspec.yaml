name: flutter_app
description: GestureWise - Real-time sign language detection app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # UI & icons
  cupertino_icons: ^1.0.8
  lottie: ^3.2.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # Camera
  camera: ^0.10.5+9

  # Machine Learning
  tflite_flutter: ^0.11.0

  # Permissions
  permission_handler: ^11.0.1

  # Profile picture
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/lotties/
    - assets/sign_language_model.tflite
    - assets/sign_to_prediction_index_map.json
